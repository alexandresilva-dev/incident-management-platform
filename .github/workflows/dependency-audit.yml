name: Dependency audit

# Aparecem vulnerabilidades novas sem que o código mude, por isso além de correr em cada
# push corre também uma vez por semana.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # segundas-feiras, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Verifica as versões fixadas (runtime + desenvolvimento) contra bases de
      # vulnerabilidades conhecidas. Falha se encontrar alguma.
      - name: Audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements-dev.txt --progress-spinner off

  node:
    name: Node dependencies (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit
        working-directory: frontend
        run: npm audit --audit-level=moderate
