services:
  db:
    image: postgres:18-alpine
    env_file: .env
    ports:
      # Só acessível a partir do próprio Mac (127.0.0.1). 5433 no host para não
      # colidir com um Postgres local já instalado na 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Código montado no contentor: editas no Mac e o --reload reinicia a API.
      - ./backend:/code
    # Aplica as migrações pendentes e só depois arranca a API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Volume anónimo: os node_modules do contentor (Linux) não são tapados pelos
      # do Mac (binários diferentes). Após mudar dependências:
      #   docker compose up --build --renew-anon-volumes
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
